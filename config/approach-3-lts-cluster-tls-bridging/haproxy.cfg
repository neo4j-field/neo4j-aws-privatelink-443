#-----------------------------------------------------------------
# HAProxy 3.0 - TLS termination, single hostname (privatelink.neo4jfield.org)
# Approach 3 (Cluster Variant): one identical config on every cluster node.
#
# Port 443 carries:
#   - Raw Bolt          (cypher-shell, native drivers)         -> 127.0.0.1:7687
#   - WebSocket Bolt    (Neo4j Browser JS driver)              -> 127.0.0.1:7687
#   - HTTPS             (Browser SPA, REST/Query API)          -> 127.0.0.1:7473
#
# Architecture:
#   Outer FE: TLS-terminate, mode tcp, peek first 4 decrypted bytes.
#     - Bolt magic (60 60 B0 17) -> raw Bolt backend (TCP, re-encrypted to Neo4j)
#     - Otherwise (HTTP/WSS)     -> hand off via PROXY-protocol to inner FE
#   Inner FE: mode http, splits WSS-Bolt (Upgrade: websocket) from plain HTTPS.
#
# In a 3-node cluster, this same config runs on every node; each HAProxy fronts
# only its local Neo4j. Cross-node distribution is handled by the NLB on :443.
#-----------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy
    maxconn 50000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout tunnel 1h
    timeout http-request 10s
    timeout http-keep-alive 2m

#-----------------------------------------------------------------
# Outer: terminates TLS, peeks first 4 decrypted bytes
#-----------------------------------------------------------------
frontend fe_tls_443
    bind :443 ssl crt /etc/haproxy/certs/neo4jfield.org.pem alpn http/1.1
    mode tcp
    tcp-request inspect-delay 5s

    # Bolt magic = 60 60 B0 17
    acl is_bolt_magic req.payload(0,4) -m bin "6060B017"
    tcp-request content accept if is_bolt_magic
    tcp-request content accept if HTTP

    use_backend be_bolt_raw      if is_bolt_magic
    default_backend be_internal_http

#-----------------------------------------------------------------
# Raw Bolt backend (TCP, re-encrypted to Neo4j Bolt:7687)
#-----------------------------------------------------------------
backend be_bolt_raw
    mode tcp
    server neo4j_bolt_raw 127.0.0.1:7687 ssl verify none

#-----------------------------------------------------------------
# Hand off non-Bolt traffic to the inner HTTP frontend
# PROXY protocol preserves real client IP for inner-FE logging
#-----------------------------------------------------------------
backend be_internal_http
    mode tcp
    server inner 127.0.0.1:8444 send-proxy-v2

#-----------------------------------------------------------------
# Inner: parses HTTP, splits WS-Bolt from HTTPS by Upgrade header
#-----------------------------------------------------------------
frontend fe_internal_http
    bind 127.0.0.1:8444 accept-proxy
    mode http
    option httplog
    option forwardfor

    acl is_websocket hdr(connection) -i upgrade
    acl is_websocket hdr(upgrade) -i websocket

    use_backend be_bolt_ws if is_websocket
    default_backend be_https

#-----------------------------------------------------------------
# Bolt-over-WebSocket (HTTP layer, re-encrypted to Bolt:7687)
#-----------------------------------------------------------------
backend be_bolt_ws
    mode http
    option http-server-close
    timeout server 1h
    timeout tunnel 1h
    server neo4j_bolt_ws 127.0.0.1:7687 ssl verify none

#-----------------------------------------------------------------
# Browser SPA + REST/Query API (HTTPS, re-encrypted to HTTPS:7473)
#-----------------------------------------------------------------
backend be_https
    mode http
    server neo4j_https 127.0.0.1:7473 ssl verify none

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
