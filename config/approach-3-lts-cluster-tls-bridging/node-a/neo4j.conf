#*****************************************************************
# Neo4j configuration — Node A (us-east-1a)
# Approach 3 (Cluster Variant): TLS-bridging HAProxy on port 443,
# single hostname for both Bolt and HTTPS.
#
# Sample domain: neo4jfield.org (replace with your domain)
# Sample IPs:    10.0.5.82 (Node A), 10.0.26.126 (Node B), 10.0.47.163 (Node C)
#*****************************************************************

initial.server.tags=us-east-1a

#-----------------------------------------------------------------
# Advertised Addresses
#
# Bolt and HTTPS advertise the SAME FQDN and the SAME port (443).
# HAProxy on this node fronts the local Neo4j and demuxes by Bolt
# magic vs HTTP after TLS termination.
#
# Cluster/RAFT/Routing use private IPs for direct intra-VPC comms.
#-----------------------------------------------------------------
server.default_advertised_address=east-a.neo4jfield.org
server.bolt.advertised_address=privatelink.neo4jfield.org:443
server.https.advertised_address=privatelink.neo4jfield.org:443

server.cluster.advertised_address=10.0.5.82:6000
server.cluster.raft.advertised_address=10.0.5.82:7000
server.routing.advertised_address=10.0.5.82:7688

#-----------------------------------------------------------------
# Network Connectors
#
# Listen ports remain at Neo4j defaults; HAProxy bridges :443
# (client-facing) to 7687 (Bolt) and 7473 (HTTPS) on loopback.
#-----------------------------------------------------------------
server.default_listen_address=0.0.0.0

# HTTP disabled — all traffic is HTTPS or Bolt/TLS
server.http.enabled=false

# HTTPS (Neo4j Browser, REST/Query API) on :7473
server.https.enabled=true
server.https.listen_address=:7473

# Bolt with TLS required
server.bolt.enabled=true
server.bolt.tls_level=REQUIRED
server.bolt.listen_address=:7687

#-----------------------------------------------------------------
# SSL Policy — Bolt
# Certificate files placed in base_directory by the operator.
# No passwords or key material are stored in this file.
#-----------------------------------------------------------------
dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/var/lib/neo4j/certificates/bolt
dbms.ssl.policy.bolt.private_key=private.key
dbms.ssl.policy.bolt.public_certificate=public.crt
dbms.ssl.policy.bolt.client_auth=NONE

#-----------------------------------------------------------------
# SSL Policy — HTTPS
#-----------------------------------------------------------------
dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=/var/lib/neo4j/certificates/https
dbms.ssl.policy.https.private_key=private.key
dbms.ssl.policy.https.public_certificate=public.crt
dbms.ssl.policy.https.client_auth=NONE

#-----------------------------------------------------------------
# Cluster Configuration
#
# V2_ONLY discovery with LIST resolver using private IPs.
# All three cluster IPs must be reachable on port 6000 within VPC.
#-----------------------------------------------------------------
server.cluster.listen_address=:6000
server.cluster.raft.listen_address=:7000
server.routing.listen_address=:7688

initial.server.mode_constraint=PRIMARY
initial.dbms.default_primaries_count=3

dbms.cluster.discovery.resolver_type=LIST
dbms.cluster.discovery.v2.endpoints=10.0.5.82:6000,10.0.26.126:6000,10.0.47.163:6000
dbms.cluster.discovery.version=V2_ONLY

#-----------------------------------------------------------------
# Routing
#
# Server-side routing forwards writes from a follower to the leader.
# In this single-FQDN cluster topology, the driver-side routing
# table collapses to one logical endpoint (the NLB), so server-side
# routing is what actually steers writes to the leader.
#-----------------------------------------------------------------
dbms.routing.enabled=true
dbms.cluster.raft.leader_failure_detection_window=20s-23s
dbms.cluster.raft.election_failure_detection_window=3s-6s
dbms.cluster.raft.membership.join_timeout=10m

#-----------------------------------------------------------------
# Metrics (Prometheus — optional)
#-----------------------------------------------------------------
server.metrics.prometheus.enabled=true
server.metrics.prometheus.endpoint=localhost:2004

#-----------------------------------------------------------------
# Miscellaneous
#-----------------------------------------------------------------
dbms.usage_report.enabled=false
db.tx_log.rotation.retention_policy=2 days 2G

server.directories.data=/var/lib/neo4j/data
server.directories.plugins=/var/lib/neo4j/plugins
server.directories.logs=/var/log/neo4j
server.directories.lib=/usr/share/neo4j/lib
server.directories.metrics=/var/lib/neo4j/metrics
server.directories.import=/var/lib/neo4j/import
server.logs.config=/etc/neo4j/server-logs.xml
server.logs.user.config=/etc/neo4j/user-logs.xml
