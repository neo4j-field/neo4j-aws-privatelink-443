#*****************************************************************
# Neo4j 5.26 LTS - single instance
# FQDNs: lts.neo4jfield.org (HTTPS) / lts-bolt.neo4jfield.org (Bolt+s)
# Both reach the host via HAProxy SNI passthrough on :443
#*****************************************************************

#-----------------------------------------------------------------
# Advertised + listen addresses
#-----------------------------------------------------------------
server.default_listen_address=0.0.0.0
server.default_advertised_address=lts.neo4jfield.org

# Bolt (TLS, listens on 7687, advertised on 443 via HAProxy SNI)
server.bolt.enabled=true
server.bolt.tls_level=REQUIRED
server.bolt.listen_address=:7687
server.bolt.advertised_address=lts.neo4jfield.org:443

# HTTP off, HTTPS on (listens on 7473, advertised on 443 via HAProxy)
server.http.enabled=false
server.https.enabled=true
server.https.listen_address=:7473
server.https.advertised_address=lts.neo4jfield.org:443

#-----------------------------------------------------------------
# Filesystem layout (RPM defaults)
#-----------------------------------------------------------------
server.directories.data=/var/lib/neo4j/data
server.directories.plugins=/var/lib/neo4j/plugins
server.directories.logs=/var/log/neo4j
server.directories.lib=/usr/share/neo4j/lib
server.directories.metrics=/var/lib/neo4j/metrics
server.directories.import=/var/lib/neo4j/import
server.logs.config=/etc/neo4j/server-logs.xml
server.logs.user.config=/etc/neo4j/user-logs.xml

#-----------------------------------------------------------------
# SSL policies (per-scope key material)
#-----------------------------------------------------------------
dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/var/lib/neo4j/certificates/bolt
dbms.ssl.policy.bolt.private_key=private.key
dbms.ssl.policy.bolt.public_certificate=public.crt
dbms.ssl.policy.bolt.client_auth=NONE

dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=/var/lib/neo4j/certificates/https
dbms.ssl.policy.https.private_key=private.key
dbms.ssl.policy.https.public_certificate=public.crt
dbms.ssl.policy.https.client_auth=NONE

#-----------------------------------------------------------------
# Metrics (local only, for Prometheus scrape over loopback)
#-----------------------------------------------------------------
server.metrics.prometheus.enabled=true
server.metrics.prometheus.endpoint=localhost:2004
server.metrics.csv.rotation.compression=zip

#-----------------------------------------------------------------
# Misc
#-----------------------------------------------------------------
dbms.usage_report.enabled=false
db.tx_log.rotation.retention_policy=2 days 2G

# Routing: single instance, no cluster — keep server-side routing on
dbms.routing.enabled=true

#-----------------------------------------------------------------
# Memory (let Neo4j auto-tune; tune after baseline. neo4j-admin server memory-recommendation can refine)
#-----------------------------------------------------------------
#server.memory.heap.initial_size=2g
#server.memory.heap.max_size=2g
#server.memory.pagecache.size=3g

#-----------------------------------------------------------------
# JVM
#-----------------------------------------------------------------
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-XX:+AlwaysPreTouch
server.jvm.additional=-XX:+UnlockExperimentalVMOptions
server.jvm.additional=-XX:+TrustFinalNonStaticFields
server.jvm.additional=-XX:+DisableExplicitGC
server.jvm.additional=-XX:-RestrictContended
server.jvm.additional=-Djdk.nio.maxCachedBufferSize=1024
server.jvm.additional=-Dio.netty.tryReflectionSetAccessible=true
server.jvm.additional=-Djdk.tls.ephemeralDHKeySize=2048
server.jvm.additional=-Djdk.tls.rejectClientInitiatedRenegotiation=true
server.jvm.additional=-XX:FlightRecorderOptions=stackdepth=256
server.jvm.additional=-XX:+UnlockDiagnosticVMOptions
server.jvm.additional=-XX:+DebugNonSafepoints
server.jvm.additional=--add-opens=java.base/java.nio=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/java.io=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
server.jvm.additional=--enable-native-access=ALL-UNNAMED
server.jvm.additional=-Dlog4j2.disable.jmx=true
server.jvm.additional=-Dlog4j.layout.jsonTemplate.maxStringLength=32768

server.windows_service_name=neo4j
