#*****************************************************************
# Neo4j configuration — Node B (us-east-1b)
# Approach 2: NES (Neo4j Enterprise Studio) — No HAProxy
#*****************************************************************

initial.server.tags=us-east-1b

server.default_advertised_address=east-b.neo4jfield.org
server.bolt.advertised_address=east-b.neo4jfield.org:443
server.cluster.advertised_address=10.0.26.126:6000
server.cluster.raft.advertised_address=10.0.26.126:7000
server.routing.advertised_address=10.0.26.126:7688
server.https.advertised_address=east-b.neo4jfield.org:7473

server.default_listen_address=0.0.0.0
server.http.enabled=false
server.https.enabled=true
server.https.listen_address=:7473
server.bolt.enabled=true
server.bolt.tls_level=REQUIRED
server.bolt.listen_address=:7687

dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/var/lib/neo4j/certificates/bolt
dbms.ssl.policy.bolt.private_key=private.key
dbms.ssl.policy.bolt.public_certificate=public.crt
dbms.ssl.policy.bolt.client_auth=NONE

dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=/var/lib/neo4j/certificates/https
dbms.ssl.policy.https.private_key=private.key
dbms.ssl.policy.https.public_certificate=public.crt
dbms.ssl.policy.https.client_auth=NONE

server.cluster.listen_address=:6000
server.cluster.raft.listen_address=:7000
server.routing.listen_address=:7688

initial.server.mode_constraint=PRIMARY
initial.dbms.default_primaries_count=3

dbms.cluster.discovery.resolver_type=LIST
dbms.cluster.discovery.v2.endpoints=10.0.5.82:6000,10.0.26.126:6000,10.0.47.163:6000
dbms.cluster.discovery.version=V2_ONLY

dbms.routing.enabled=true
dbms.cluster.raft.leader_failure_detection_window=20s-23s
dbms.cluster.raft.election_failure_detection_window=3s-6s
dbms.cluster.raft.membership.join_timeout=10m

dbms.usage_report.enabled=false

server.directories.data=/var/lib/neo4j/data
server.directories.plugins=/var/lib/neo4j/plugins
server.directories.logs=/var/log/neo4j
server.directories.lib=/usr/share/neo4j/lib
server.directories.metrics=/var/lib/neo4j/metrics
server.directories.import=/var/lib/neo4j/import
server.logs.config=/etc/neo4j/server-logs.xml
server.logs.user.config=/etc/neo4j/user-logs.xml
