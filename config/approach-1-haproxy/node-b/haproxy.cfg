#-----------------------------------------------------------------
# HAProxy configuration — Node B (us-east-1b)
# Approach 1: SNI-based routing on port 443
#
# Node B HAProxy is identical to Node A, but does not host the
# graph360 or studio backends (those run only on Node A in this
# deployment). Remove or add backend blocks to match your setup.
#-----------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy
    maxconn 50000

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    timeout client 30m
    timeout server 30m

#-----------------------------------------------------------------
# Frontend: accept all TLS on :443, route by SNI
#-----------------------------------------------------------------
frontend fe_neo4j_443
    mode tcp
    bind :443 ssl crt /etc/haproxy/certs/neo4jfield.org.pem

    acl sni_browser  ssl_fc_sni -i privatelink.neo4jfield.org
    acl sni_bolt     ssl_fc_sni -i east-b.neo4jfield.org

    tcp-request content reject if !sni_browser !sni_bolt

    use_backend be_neo4j_https if sni_browser
    use_backend be_neo4j_bolt  if sni_bolt

#-----------------------------------------------------------------
# Backend: Neo4j HTTPS (Browser)
#-----------------------------------------------------------------
backend be_neo4j_https
    mode tcp
    server neo4j_https 127.0.0.1:7473 ssl verify none check

#-----------------------------------------------------------------
# Backend: Neo4j Bolt
#-----------------------------------------------------------------
backend be_neo4j_bolt
    mode tcp
    server neo4j_bolt 127.0.0.1:7687 ssl verify none check

#-----------------------------------------------------------------
# Stats endpoint (localhost only)
#-----------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
