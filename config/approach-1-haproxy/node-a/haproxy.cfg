#-----------------------------------------------------------------
# HAProxy configuration — Node A (us-east-1a)
# Approach 1: SNI-based routing on port 443
#
# HAProxy terminates TLS on :443, inspects the SNI hostname,
# and routes to the appropriate backend:
#   privatelink.neo4jfield.org  → Neo4j HTTPS  :7473
#   east-a.neo4jfield.org       → Neo4j Bolt   :7687  (per-node Bolt endpoint)
#   east-bolt.neo4jfield.org    → Neo4j Bolt   :7687  (shared Bolt alias, optional)
#   graph360.neo4jfield.org     → Graph360 app :3001  (optional custom app)
#   studio.neo4jfield.org       → Enterprise Studio :9090 (optional)
#
# Certificate: /etc/haproxy/certs/neo4jfield.org.pem
#   Created by: cat fullchain.crt private.key > /etc/haproxy/certs/neo4jfield.org.pem
#   No key material is stored in this config file.
#-----------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy
    maxconn 50000

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    timeout client 30m
    timeout server 30m

#-----------------------------------------------------------------
# Frontend: accept all TLS on :443, route by SNI
#-----------------------------------------------------------------
frontend fe_neo4j_443
    mode tcp
    bind :443 ssl crt /etc/haproxy/certs/neo4jfield.org.pem

    # Match on the SNI hostname sent in the TLS ClientHello
    acl sni_browser  ssl_fc_sni -i privatelink.neo4jfield.org
    acl sni_bolt     ssl_fc_sni -i east-a.neo4jfield.org
    acl sni_studio   ssl_fc_sni -i studio.neo4jfield.org

    # Reject any connection that does not match a known SNI
    tcp-request content reject if !sni_browser !sni_bolt !sni_studio

    use_backend be_neo4j_https       if sni_browser
    use_backend be_neo4j_bolt        if sni_bolt
    use_backend be_enterprise_studio if sni_studio

#-----------------------------------------------------------------
# Backend: Neo4j HTTPS (Browser)
# HAProxy re-establishes a TLS connection to Neo4j :7473.
# ssl verify none is safe here because both are on the same host.
#-----------------------------------------------------------------
backend be_neo4j_https
    mode tcp
    server neo4j_https 127.0.0.1:7473 ssl verify none check

#-----------------------------------------------------------------
# Backend: Neo4j Bolt
# HAProxy re-establishes a TLS connection to Neo4j :7687.
#-----------------------------------------------------------------
backend be_neo4j_bolt
    mode tcp
    server neo4j_bolt 127.0.0.1:7687 ssl verify none check

#-----------------------------------------------------------------
# Backend: Custom application (optional — e.g. graph360)
#-----------------------------------------------------------------
backend be_graph360
    mode tcp
    option tcp-check
    server graph360 127.0.0.1:3001 check

#-----------------------------------------------------------------
# Backend: Neo4j Enterprise Studio (optional)
#-----------------------------------------------------------------
backend be_enterprise_studio
    mode tcp
    option tcp-check
    server enterprise-studio 127.0.0.1:9090 check

#-----------------------------------------------------------------
# Stats endpoint (localhost only)
#-----------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
