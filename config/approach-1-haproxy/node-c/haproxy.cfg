#-----------------------------------------------------------------
# HAProxy configuration — Node C (us-east-1c)
# Approach 1: SNI-based routing on port 443
#
# Each HAProxy handles ALL three bolt hostnames:
#   - Routes its own node's SNI to localhost (127.0.0.1:7687)
#   - Routes other nodes' SNI to their private IPs
#
# This means whichever HAProxy instance the NLB selects, it always
# forwards bolt traffic to the correct Neo4j backend.
#
# Certificate: /etc/haproxy/certs/neo4jfield.org.pem
#   Created by: cat fullchain.crt private.key > /etc/haproxy/certs/neo4jfield.org.pem
#-----------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy
    maxconn 50000

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    timeout client 30m
    timeout server 30m

#-----------------------------------------------------------------
# Frontend: accept all TLS on :443, route by SNI
#-----------------------------------------------------------------
frontend fe_neo4j_443
    mode tcp
    bind :443 ssl crt /etc/haproxy/certs/neo4jfield.org.pem

    acl sni_https   ssl_fc_sni -i privatelink.neo4jfield.org
    acl sni_bolt_a  ssl_fc_sni -i east-a.neo4jfield.org
    acl sni_bolt_b  ssl_fc_sni -i east-b.neo4jfield.org
    acl sni_bolt_c  ssl_fc_sni -i east-c.neo4jfield.org

    tcp-request content reject if !sni_https !sni_bolt_a !sni_bolt_b !sni_bolt_c

    use_backend be_neo4j_https  if sni_https
    use_backend be_neo4j_bolt_a if sni_bolt_a
    use_backend be_neo4j_bolt_b if sni_bolt_b
    use_backend be_neo4j_bolt_c if sni_bolt_c

#-----------------------------------------------------------------
# Backend: Neo4j HTTPS (Browser)
#-----------------------------------------------------------------
backend be_neo4j_https
    mode tcp
    server neo4j_https 127.0.0.1:7473 ssl verify none check

#-----------------------------------------------------------------
# Backend: Neo4j Bolt — Node A (remote)
#-----------------------------------------------------------------
backend be_neo4j_bolt_a
    mode tcp
    server neo4j_bolt_a 10.0.5.82:7687 ssl verify none check

#-----------------------------------------------------------------
# Backend: Neo4j Bolt — Node B (remote)
#-----------------------------------------------------------------
backend be_neo4j_bolt_b
    mode tcp
    server neo4j_bolt_b 10.0.26.126:7687 ssl verify none check

#-----------------------------------------------------------------
# Backend: Neo4j Bolt — Node C (local)
#-----------------------------------------------------------------
backend be_neo4j_bolt_c
    mode tcp
    server neo4j_bolt_c 127.0.0.1:7687 ssl verify none check

#-----------------------------------------------------------------
# Stats endpoint (localhost only)
#-----------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
